<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Заметки</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--red:#d64545;
  --love1:#ff5c8a;--love2:#ff8fab;--lovebg:#fff0f5;--loveink:#d63a6b}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa0;--line:#2e2e33;--red:#ef6b6b;
  --love1:#ff5c8a;--love2:#ff8fab;--lovebg:#3a1f2a;--loveink:#ff8fab}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* вход */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px}
#login h1{font-size:18px;margin:0 0 14px}
#login input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#login label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px;color:var(--muted)}
#login button{width:100%;font:inherit;padding:10px;border:0;border-radius:10px;background:var(--ink);color:var(--card);cursor:pointer}
#login button:disabled{opacity:.6}
#err{color:var(--red);font-size:14px;min-height:20px;margin:8px 0 0}

/* вкладки */
#app{display:none}
#app.on{display:block}
#tabs{position:fixed;inset:0 0 auto 0;height:58px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);z-index:2}
.tab{font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease,color .2s ease}
.tab:hover{transform:translateY(-1px)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.tab.love{border-color:var(--love2);background:var(--lovebg);color:var(--loveink)}
.tab.love.on{background:linear-gradient(135deg,var(--love1),var(--love2));border-color:transparent;color:#fff;
  box-shadow:0 4px 18px rgba(255,92,138,.45)}
.tab .ico{font-size:16px;line-height:1}
.tab.love .ico{display:inline-block}
.tab.love.on .ico{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}60%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tab.love.on .ico{animation:none}.tab{transition:none}}
#out{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:8px}
#out:hover{background:var(--bg)}
#frame{position:fixed;top:58px;left:0;width:100%;height:calc(100% - 58px);border:0;background:var(--bg)}
@media (max-width:480px){.tab{padding:7px 13px;font-size:14px}#tabs{justify-content:flex-start}#out{font-size:12px}}
</style>
</head>
<body>
<div id="login">
  <form id="f" autocomplete="on">
    <h1>🔒 Заметки</h1>
    <input type="text" name="username" value="notes" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Пароль" autofocus>
    <label><input type="checkbox" id="rm" checked> Запомнить на этом устройстве</label>
    <button id="go">Открыть</button>
    <p id="err"></p>
  </form>
</div>
<div id="app">
  <nav id="tabs"></nav>
  <iframe id="frame" title="Дашборд"></iframe>
</div>

const S = crypto.subtle, KEY = "mk";
const $ = id => document.getElementById(id);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => { let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function decryptPages(raw) {
  const k = await S.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await S.decrypt({ name: "AES-GCM", iv: unb64(P.iv) }, k, unb64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function start(pages, raw) {
  const K64 = b64(raw);
  let cur = 0; try { const i = pages.findIndex(p => p.id === localStorage.getItem("who")); if (i >= 0) cur = i; } catch (e) {}
  const tabs = $("tabs"), frame = $("frame");
  function show(i) {
    cur = i; try { localStorage.setItem("who", pages[i].id); } catch (e) {}
    tabs.innerHTML = pages.map((p, j) =>
      `<button class="tab${p.style ? " " + p.style : ""}${j === i ? " on" : ""}" value="${j}"><span class="ico">${esc(p.icon || "")}</span>${esc(p.label)}</button>`
    ).join("") + `<a href="#" id="out" title="Забыть пароль на этом устройстве">выйти</a>`;
    const pre = `<script>window.__KEY=${JSON.stringify(K64)};window.__SYNC=${JSON.stringify(pages[i].sync || null)};<\/script>`;
    frame.srcdoc = pages[i].html.replace("<head>", "<head>" + pre);
  }
  tabs.addEventListener("click", e => {
    if (e.target.id === "out") { e.preventDefault(); try { localStorage.removeItem(KEY); } catch (_) {} location.reload(); return; }
    const b = e.target.closest("button.tab"); if (b && +b.value !== cur) show(+b.value);
  });
  $("login").remove();
  $("app").classList.add("on");
  show(cur);
}

(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { const raw = unb64(saved); start(await decryptPages(raw), raw); return; }
    catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
  }
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("go"), err = $("err");
    btn.disabled = true; btn.textContent = "Открываю…"; err.textContent = "";
    try {
      const base = await S.importKey("raw", new TextEncoder().encode($("pw").value), "PBKDF2", false, ["deriveBits"]);
      const raw = new Uint8Array(await S.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(P.salt), iterations: P.iter }, base, 256));
      const pages = await decryptPages(raw);
      try { if ($("rm").checked) localStorage.setItem(KEY, b64(raw)); } catch (_) {}
      start(pages, raw);
    } catch (e2) {
      btn.disabled = false; btn.textContent = "Открыть"; err.textContent = "Неверный пароль";
    }
  });
})();
</script>
